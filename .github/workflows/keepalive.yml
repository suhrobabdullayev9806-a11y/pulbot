name: Render keep-alive

# Render bepul web-service 15 daqiqa harakatsizlikdan keyin uxlaydi.
# Bu workflow /health ni doimiy urib turadi va o'zini-o'zi qayta ishga tushiradi
# (zanjir), shuning uchun cron kechikishiga bog'liq emas.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: pulbot-keepalive
  cancel-in-progress: false

permissions:
  actions: write

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Keyingi runni navbatga qo'yish (zanjir davomi)
        env:
          GH_TOKEN: ${{ secrets.KEEPALIVE_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          if [ -z "$GH_TOKEN" ]; then echo "KEEPALIVE_TOKEN yo'q — zanjir o'rniga cron ishlatiladi"; exit 0; fi
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/actions/workflows/keepalive.yml/dispatches" \
            -d '{"ref":"main"}')
          echo "navbatga qo'yish: HTTP $code"

      - name: /health ping (5.5 soat)
        run: |
          URL="https://pulbot-9176.onrender.com/health"
          fail=0
          for i in $(seq 1 330); do
            code=$(curl -s -o /dev/null -m 120 -w "%{http_code}" "$URL" || true)
            if [ "$code" != "200" ]; then
              fail=$((fail + 1))
              echo "$(date -u +%H:%M:%S) ping $i -> HTTP $code"
            elif [ $((i % 30)) -eq 0 ]; then
              echo "$(date -u +%H:%M:%S) ping $i -> 200 (xato: $fail)"
            fi
            sleep 60
          done
          echo "tugadi, xatolar: $fail/330"
